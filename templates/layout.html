<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeReviewAgent</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 2rem auto; max-width: 64rem; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; } h2 { font-size: 1.15rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.45rem 0.7rem; border-bottom: 1px solid #e3e3e3; font-size: 0.9rem; }
    th { background: #f6f6f6; }
    a { color: #0969da; text-decoration: none; }
    .sev-critical { color: #cf222e; font-weight: 600; }
    .sev-warning { color: #9a6700; font-weight: 600; }
    .sev-suggestion { color: #57606a; }
    .muted { color: #7a7a7a; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>CodeReviewAgent Dashboard</h1>
  {{template "content" .}}
</body>
</html>
